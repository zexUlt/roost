name: Package

# The packages of a release: the macOS .app and .dmg, the x86_64 and aarch64
# AppImages, their check on the build runner (which has Qt), their smoke on a
# clean machine, and the draft release. The jobs come with the packaging
# scripts (tools/package_*.sh, tools/package_smoke.sh).
#
# A change to the workflow or to the packaging is proved by dispatching it on
# its branch: gh workflow run package.yml --ref <branch>. A dispatch takes
# the workflow from that branch, but only a workflow that is on trunk can be
# dispatched, hence this file before its jobs.
#
# The smoke jobs (smoke-macos, smoke-linux) run the packages on machines that
# did not build them and have no Qt; the release job makes a draft release of
# the packages that passed: on a `v*` tag pushed by hand; on the night run and
# on a dispatch with `release`, when some product change lies after the last
# `v*` tag (the run makes the tag itself, once everything is green; a product
# change is any file outside docs/, tests/, .claude/, .github/ and *.md, and
# .github/workflows/package.yml, where the Qt and zig versions live); on a
# dispatch with draft_release (a dry run: the draft is named dryrun-<run id>,
# no git tag is made, and the draft is deleted after review). A rerun of the
# failed job `release` finishes its draft. Publishing is a manual step. The
# plan of a run, its version included, is tools/package_plan.sh.
#
# Runs on `v*` tags, on dispatch, on pushes to trunk that change the
# packaging and once a night on trunk, not on pull requests: a macOS runner
# per pull request is too much, and a change to packaging proves itself by
# the dispatch above. The night run exists so that a release is tagged on a
# trunk commit whose packaging has already passed: a flaky test found by the
# packaging of the tag itself is too late. The job `changes` skips the
# night run (and with it every other job) when nothing that reaches a package
# changed since the last run of this workflow on trunk, whatever that run
# ended with: a dispatch packages anyway. A night that has a release to make
# is not skipped: a red night followed by a day of documentation must not
# leave a product change without a release. But a night does not release on
# a commit on which any earlier night ended red (that would hide a flaky
# test): it falls back to the rule above, and a release is made after the
# fix, or by a dispatch with `release`. Only documentation (docs/, .claude/,
# *.md, issue templates) does not reach a package. The path list is the files that rarely change and
# shape a package or its check; the build and the tests of the code run in
# ci.yml on every pull request. QML of the plugins and the project version
# are left out: they change often, and the smoke and the version check of a
# tag catch them.
# GitHub does not apply path filters to tags.
on:
  schedule:
    - cron: "17 2 * * *"
  push:
    tags: ["v*"]
    branches: [trunk]
    paths:
      - .github/workflows/package.yml
      - packaging/**
      - cmake/Install.cmake
      - tools/package_*.sh
      - tools/check_bundle.sh
      - tools/check_appimage.sh
      - .github/actions/ccache/**
      - CMakePresets.json
      - cmake/ghostty.cmake
      - licenses/**
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
      - tests/fixtures/claude_agents.json
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also make a draft release (dryrun-<run id>, no git tag) of the packages"
        type: boolean
        default: false
      release:
        description: "Release now: if some product change lies after the last v* tag, tag the next version on this commit (trunk only) and make its draft release"
        type: boolean
        default: false

permissions:
  contents: read

# Runs that may release never overlap (a dispatch during the night would
# choose the same version). A running one is never cancelled. Only one run
# waits in the group: a newer pending run replaces (cancels) the older pending
# one, so of several nights and dispatches queued behind a long run, the last
# one is made. The night is made again the next day, a dispatch by hand.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.release) && format('{0}-release', github.workflow) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

# Keep in step with ci.yml.
env:
  QT_VERSION: 6.12.0
  ZIG_VERSION: 0.17.1

# Without an explicit shell, run steps get `bash -e` and no pipefail.
defaults:
  run:
    shell: bash

jobs:
  # Decides whether the jobs below run and what version they build, by
  # tools/package_plan.sh (its header has the rules). Only a night run can be
  # skipped: tags, dispatches and pushes always package, and so does a night
  # that has a release to make, unless an earlier night ended red on this very
  # commit (then no release, and the night is skipped by the base rule). The
  # base of a night run is the head of the last other run of this workflow on
  # trunk (any event, any result).
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      patch: ${{ steps.plan.outputs.patch }}
      last: ${{ steps.plan.outputs.last }}
    steps:
      # All the tags and the history: the plan reads both.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE: ${{ inputs.release || 'false' }}
          DRAFT: ${{ inputs.draft_release || 'false' }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BASE=
          PREV_NIGHT_SHA=
          PREV_NIGHT_RED=false
          if [ "$EVENT" = schedule ]; then
            BASE=$(gh api "repos/$REPO/actions/workflows/package.yml/runs?branch=trunk&per_page=20" \
              --jq "[.workflow_runs[] | select(.id != $RUN_ID)][0].head_sha // empty")
            # Any earlier night that ended red on this very commit, not only
            # the last one: a red night followed by a skipped one (success)
            # must not release the red commit on the third.
            red=$(gh api "repos/$REPO/actions/workflows/package.yml/runs?branch=trunk&event=schedule&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $RUN_ID and .head_sha == \"$GITHUB_SHA\" and .conclusion == \"failure\")] | length")
            if [ "${red:-0}" -gt 0 ]; then
              PREV_NIGHT_SHA=$GITHUB_SHA
              PREV_NIGHT_RED=true
            fi
          fi
          export BASE PREV_NIGHT_SHA PREV_NIGHT_RED
          set -o pipefail
          tools/package_plan.sh | tee -a "$GITHUB_OUTPUT"

  # The release build, its tests, then the .app and .dmg and their checks. The
  # Qt, zig and caches are those of the macOS release job of ci.yml.
  macos:
    name: macos
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja ccache

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      # setup-zig unpacks zig into a new temporary directory on every run, and
      # the zig build command line holds the path to zig: ninja would see a
      # changed command and rebuild libghostty-vt in spite of the cache. A
      # wrapper at a fixed path, first in PATH, keeps the command the same.
      - name: Zig at a fixed path
        run: |
          real=$(command -v zig)
          mkdir -p "$HOME/zig-bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$real" > "$HOME/zig-bin/zig"
          chmod +x "$HOME/zig-bin/zig"
          echo "$HOME/zig-bin" >> "$GITHUB_PATH"

      # The entry the release job of ci.yml saves on trunk: the same key, read
      # only, so that a packaging run pushes nothing out of the full cache.
      - name: Restore libghostty-vt
        uses: actions/cache/restore@v4
        with:
          path: |
            build/release/_deps
            build/release/.ninja_log
            build/release/.ninja_deps
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-release-${{ hashFiles('cmake/ghostty.cmake', 'CMakePresets.json') }}

      # Restore only: ci.yml saves the compiler cache, from trunk.
      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: release

      # The patch of the version, when the plan has one (a tag, a release, a
      # dry run); otherwise the project's own, 0.
      - name: Configure
        run: cmake --preset release ${PATCH:+-DROOST_VERSION_PATCH="$PATCH"}
        env:
          PATCH: ${{ needs.changes.outputs.patch }}

      - name: Build
        run: cmake --build --preset release

      - name: Compiler cache hits
        run: ccache --show-stats

      - name: Test
        run: ctest --preset release
        env:
          ROOST_FRAME_BUDGET: report

      - name: Package
        run: tools/package_macos.sh build/release "$RUNNER_TEMP/package"

      # The version of the plan (the tag, or the next one of a release or a
      # dry run) is the version of the project, which the app carries.
      - name: The tag is the version of the app
        if: needs.changes.outputs.version != ''
        env:
          PLANNED: ${{ needs.changes.outputs.version }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$RUNNER_TEMP/package/stage/roost.app/Contents/Info.plist")
          if [ "$PLANNED" != "$version" ]; then
            echo "::error::the planned version $PLANNED is not the version $version of the app"
            exit 1
          fi

      - name: Check the bundle and the .dmg
        run: |
          dmgs=("$RUNNER_TEMP"/package/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ] || { echo "::error::expected one .dmg"; exit 1; }
          tools/check_bundle.sh "$RUNNER_TEMP/package/stage/roost.app" "${dmgs[0]}"

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: roost-macos-dmg
          path: ${{ runner.temp }}/package/*.dmg
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.release == 'true') && 90 || 7 }}

  # The AppImage, on the machine of its arch: x86_64 on ubuntu-24.04, aarch64
  # on ubuntu-24.04-arm. Set up as the Linux jobs of ci.yml (same Qt, zig,
  # clang, caches), with the caches restored only: trunk saves them, a branch
  # run must not push others out of the repository's full cache. The tests run
  # before the package, on both arches: the x86_64 build is not made anywhere
  # else. The Qt, zig and clang versions are those of ci.yml.
  linux:
    name: linux (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    env:
      PRESET: release
    steps:
      - uses: actions/checkout@v4

      # As in ci.yml: clang 20, the libraries Qt needs to link and to run under
      # the offscreen platform, a monospace font. After them the libraries of
      # the xcb platform plugin (linuxdeploy follows its dependencies and
      # fails on one it cannot find), and fuse3, to run the AppImage.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-20 libclang-rt-20-dev ccache \
            libgl-dev libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0t64 \
            libdbus-1-3 fonts-dejavu-mono \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            fuse3
          sudo ln -sf "$(command -v clang-20)" /usr/local/bin/clang
          sudo ln -sf "$(command -v clang++-20)" /usr/local/bin/clang++

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          install-deps: false
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      # setup-zig unpacks zig into a new temporary directory on every run, and
      # the zig build command line holds the path to zig: ninja would see a
      # changed command and rebuild libghostty-vt in spite of the cache. A
      # wrapper at a fixed path, first in PATH, keeps the command the same.
      - name: Zig at a fixed path
        run: |
          real=$(command -v zig)
          mkdir -p "$HOME/zig-bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$real" > "$HOME/zig-bin/zig"
          chmod +x "$HOME/zig-bin/zig"
          echo "$HOME/zig-bin" >> "$GITHUB_PATH"

      # The key of the test job of ci.yml, so that what trunk saved is read.
      - name: Restore libghostty-vt
        uses: actions/cache/restore@v4
        with:
          path: |
            build/${{ env.PRESET }}/_deps
            build/${{ env.PRESET }}/.ninja_log
            build/${{ env.PRESET }}/.ninja_deps
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ env.PRESET }}-${{ hashFiles('cmake/ghostty.cmake', 'CMakePresets.json') }}

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: ${{ env.PRESET }}

      # The patch of the version, as in the macOS job. The version of the
      # AppImage is not compared with the plan: only the .dmg is (its app
      # carries the same project version).
      - name: Configure
        run: cmake --preset ${{ env.PRESET }} ${PATCH:+-DROOST_VERSION_PATCH="$PATCH"}
        env:
          PATCH: ${{ needs.changes.outputs.patch }}

      - name: Build
        run: cmake --build --preset ${{ env.PRESET }}

      - name: Compiler cache hits
        run: ccache --show-stats

      # The frame budget is a timing on real hardware (see ci.yml).
      - name: Test
        run: ctest --preset ${{ env.PRESET }}
        env:
          ROOST_FRAME_BUDGET: report

      - name: Package
        run: tools/package_linux.sh build/${{ env.PRESET }} build/package

      - name: Check the AppImage
        run: |
          command -v objdump >/dev/null || { sudo apt-get update && sudo apt-get install -y binutils; }
          tools/check_appimage.sh build/package/roost-${{ matrix.arch }}.AppImage

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: roost-${{ matrix.arch }}.AppImage
          path: build/package/roost-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.release == 'true') && 90 || 7 }}

  # The .dmg on a macOS with no Qt: the runner image, the .dmg artifact and the
  # script, nothing built here. It fails if a Qt is on the machine (the smoke
  # would prove nothing) or if the app loads one from outside itself, and
  # starts the app once through LaunchServices (`open -n`).
  smoke-macos:
    name: smoke (macos)
    needs: macos
    runs-on: macos-15
    steps:
      # The script and the fixture of the fake claude only.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            tests/fixtures

      - uses: actions/download-artifact@v4
        with:
          name: roost-macos-dmg
          path: ${{ runner.temp }}/dmg

      - name: No Qt on this machine
        run: |
          found=0
          for path in /opt/homebrew/opt/qtbase /opt/homebrew/opt/qt /usr/local/opt/qtbase \
            /usr/local/opt/qt /Library/Frameworks/QtCore.framework "$HOME/Qt"; do
            if [ -e "$path" ]; then
              echo "::error::$path exists: this image has a Qt"
              found=1
            fi
          done
          if command -v qmake >/dev/null 2>&1 || command -v macdeployqt >/dev/null 2>&1; then
            echo "::error::qmake or macdeployqt is in PATH: this image has a Qt"
            found=1
          fi
          if brew list --formula 2>/dev/null | grep -i '^qt'; then
            echo "::error::a Qt formula of Homebrew is installed"
            found=1
          fi
          exit "$found"

      - name: Smoke the .dmg
        run: |
          dmgs=("$RUNNER_TEMP"/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ] || { echo "::error::expected one .dmg"; exit 1; }
          tools/package_smoke.sh "${dmgs[0]}" --launch-services
        env:
          # The runner has a logged-in GUI session: the windows run on the
          # platform plugin of a user's Mac, not offscreen.
          ROOST_SMOKE_QPA: cocoa

  # The AppImage in a stock Ubuntu 24.04 with the libraries of a desktop and no
  # Qt: the image of the container, the AppImage artifact and the script. The
  # AppImage runs through FUSE (/dev/fuse and the capability that mounts it),
  # as a user runs it. On the machine of its arch, as the build. The libraries
  # of a stock desktop: ubuntu-desktop-minimal, with no recommended packages.
  smoke-linux:
    name: smoke (${{ matrix.arch }})
    needs: linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: ubuntu:24.04
      options: >-
        --device /dev/fuse --cap-add SYS_ADMIN
        --security-opt apparmor:unconfined
    steps:
      # procps: pgrep and ps, which the script uses and the image lacks.
      # xvfb and xauth: the window runs on the xcb platform plugin, as on a
      # desktop, under a virtual display (xvfb-run).
      - name: Install the tools of the script and fuse3
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates procps fuse3 fonts-dejavu-mono xvfb xauth

      # What every desktop has is what the AppImage leaves out
      # (packaging/linux/system-libraries.txt); a minimal desktop is the
      # stock set. No service starts inside the container.
      - name: Install the libraries of a desktop (ubuntu-desktop-minimal)
        timeout-minutes: 20
        run: |
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ubuntu-desktop-minimal
          echo "Libraries of a desktop: ubuntu-desktop-minimal, $(dpkg-query -W | wc -l) packages" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The container has no git: the action takes the archive of the commit.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            tests/fixtures
            packaging/linux

      - uses: actions/download-artifact@v4
        with:
          name: roost-${{ matrix.arch }}.AppImage
          path: ${{ runner.temp }}/appimage

      - name: No Qt on this machine
        run: |
          found=0
          for path in /usr/lib/*/libQt6Core.so* /usr/lib/libQt6Core.so* /usr/lib/qt6 /opt/Qt "$HOME/Qt"; do
            if [ -e "$path" ]; then
              echo "::error::$path exists: this image has a Qt 6"
              found=1
            fi
          done
          if command -v qmake6 >/dev/null 2>&1 || command -v qmake >/dev/null 2>&1; then
            echo "::error::qmake is in PATH: this image has a Qt"
            found=1
          fi
          dpkg-query -W 'libqt*' 'qt6*' 2>/dev/null || true
          exit "$found"

      - name: Smoke the AppImage
        run: |
          chmod +x "$RUNNER_TEMP/appimage/roost-${{ matrix.arch }}.AppImage"
          xvfb-run -a tools/package_smoke.sh "$RUNNER_TEMP/appimage/roost-${{ matrix.arch }}.AppImage"
        env:
          ROOST_SMOKE_QPA: xcb

  # A draft release of the packages that passed their smoke: the .dmg, the two
  # AppImages and SHA256SUMS. Three kinds of run:
  #   - a pushed tag v*: the tag is there, the real key signs;
  #   - a release (the night, or a dispatch with `release`, planned by the job
  #     `changes`): the real key signs, and when the assets and the signature
  #     are ready the job makes the annotated tag v<version> on this commit
  #     (REST API: git/tags, git/refs) and then the draft. A tag pushed with
  #     GITHUB_TOKEN starts no workflow, so package.yml does not run again on
  #     it. The notes get the changes since the last tag;
  #   - a dry run (dispatch with draft_release): the tag name is dryrun-<run
  #     id>, a throwaway key signs, no git tag is made (a draft does not make
  #     one, until it is published).
  # Never published, no release or tag deleted here: that is by hand, after the
  # notes and the assets are read. The only job with the right to write.
  release:
    name: release (draft)
    needs: [changes, smoke-macos, smoke-linux]
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.draft_release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # What the release is called, and whether it is a real one (the real key).
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.changes.outputs.release == 'true' && format('v{0}', needs.changes.outputs.version) || format('dryrun-{0}', github.run_id) }}
      IS_REAL: ${{ startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.release == 'true' }}
    steps:
      # Only the public key: the signature is checked against the committed one.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/minisign.pub
          sparse-checkout-cone-mode: false
          # gh takes GH_TOKEN; no git command needs the write token later.
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: roost-*
          path: ${{ runner.temp }}/artifacts

      - name: Assets and SHA256SUMS
        run: |
          mkdir "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -type f \( -name '*.dmg' -o -name '*.AppImage' \) \
            -exec cp {} "$RUNNER_TEMP/release/" \;
          cd "$RUNNER_TEMP/release"
          files=(*)
          dmgs=(*.dmg)
          if [ "${#files[@]}" -ne 3 ] || [ "${#dmgs[@]}" -ne 1 ] ||
            [ ! -f roost-x86_64.AppImage ] || [ ! -f roost-aarch64.AppImage ]; then
            echo "::error::expected one .dmg and the two AppImages, got: ${files[*]}"
            exit 1
          fi
          sha256sum -- "${files[@]}" >SHA256SUMS
          cat SHA256SUMS

      - name: Install minisign
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends minisign

      # SHA256SUMS gets a minisign signature whose trusted comment names the
      # tag. On a tag and on a release the secret key signs and
      # packaging/minisign.pub verifies. A dry run signs with a throwaway pair,
      # so the real key signs only what is released (the "release key check"
      # step proves the pair separately). The key file
      # lives in a private directory that goes away on any exit. The secret
      # comes in through env only and is never printed.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/minisign.XXXXXX")
          trap 'rm -rf "$keydir"' EXIT
          if [ "$IS_REAL" = true ]; then
            if [ -z "$MINISIGN_SECRET_KEY" ]; then
              echo "::error::the secret MINISIGN_SECRET_KEY is empty"
              exit 1
            fi
            printf '%s\n' "$MINISIGN_SECRET_KEY" >"$keydir/key"
            pub="$GITHUB_WORKSPACE/packaging/minisign.pub"
          else
            minisign -G -W -p "$keydir/key.pub" -s "$keydir/key" >/dev/null
            pub="$keydir/key.pub"
          fi
          comment="roost $TAG SHA256SUMS"
          cd "$RUNNER_TEMP/release"
          minisign -S -s "$keydir/key" -m SHA256SUMS -t "$comment"
          rm -f "$keydir/key"
          out=$(minisign -V -p "$pub" -m SHA256SUMS)
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qxF "Trusted comment: $comment"; then
            echo "::error::the trusted comment of SHA256SUMS.minisig is not '$comment'"
            exit 1
          fi
          sed -n 2p "$pub" >"$RUNNER_TEMP/verify-key.txt"
          ls -l SHA256SUMS.minisig

      # A dry run never signs with the real key; this proves, before the first
      # tag, that the secret and packaging/minisign.pub are one pair. The probe
      # and its signature are not released. A release dispatch signs with the
      # real key anyway.
      - name: Release key check
        if: github.event_name == 'workflow_dispatch' && !inputs.release
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::the secret MINISIGN_SECRET_KEY is empty"
            exit 1
          fi
          keydir=$(mktemp -d "$RUNNER_TEMP/minisign.XXXXXX")
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$keydir/key"
          printf 'roost release key check\n' >"$keydir/probe.txt"
          minisign -S -s "$keydir/key" -m "$keydir/probe.txt" -t "roost release key check"
          rm -f "$keydir/key"
          minisign -V -p "$GITHUB_WORKSPACE/packaging/minisign.pub" -m "$keydir/probe.txt"
          echo "release key check: the secret and packaging/minisign.pub are one pair"

      # The source of the Qt of the packages must be where the notes say.
      - name: Notes
        env:
          KEYSRC: ${{ env.IS_REAL == 'true' && 'packaging/minisign.pub in the repository' || 'a dry run, so a throwaway key and not the release key' }}
        run: |
          src="https://download.qt.io/official_releases/qt/${QT_VERSION%.*}/${QT_VERSION}/single/qt-everywhere-src-${QT_VERSION}.tar.xz"
          curl -fsIL --retry 3 "$src" >/dev/null || { echo "::error::$src does not exist"; exit 1; }
          read -r -d '' notes <<'EOF' || true
          Packages of roost @TAG@.

          ## Install

          macOS (Apple silicon): open the `.dmg`, drag roost to Applications. The app is signed ad hoc, not with a Developer ID, so Gatekeeper refuses it on the first start. Remove the quarantine attribute once:

              xattr -dr com.apple.quarantine /Applications/roost.app

          Linux: `chmod +x roost-<arch>.AppImage`, then run it. It needs FUSE 3 (the `fuse3` package) to mount itself. Built on Ubuntu 24.04: needs glibc 2.39 or newer and the libstdc++ of GCC 14. The window runs on X11 or XWayland (the AppImage carries the xcb platform plugin, not the Wayland one).

          Check the files against `SHA256SUMS`: `sha256sum -c SHA256SUMS --ignore-missing`.

          `SHA256SUMS` is signed with minisign (`SHA256SUMS.minisig`). Check the signature with the public key (@KEYSRC@); the trusted comment names the tag, `roost @TAG@ SHA256SUMS`:

              minisign -Vm SHA256SUMS -P @KEY@

          ## Licences

          roost is under the licence in `LICENSE`; the licence texts of the packages are in the packages (`Contents/Resources/licenses` of the app, `usr/share/licenses/roost` of the AppImage), with `THIRD_PARTY_LICENSES`.

          - Qt @QT@, under the LGPL v3, linked dynamically as separate libraries that can be replaced. Source of this version: @SRC@
          - ICU (the AppImage only, the libraries of the Qt build): the ICU licence, `usr/share/licenses/roost/ICU-LICENSE.txt`.
          EOF
          # The values go in as they are: a tag may hold `|`, `&` or `\`, which
          # sed would take for its own. `&` in the replacement is the matched
          # text in bash 5.2 unless the option is off (and the value quoted).
          shopt -u patsub_replacement 2>/dev/null || true
          notes=${notes//@TAG@/"$TAG"}
          notes=${notes//@KEY@/"$(cat "$RUNNER_TEMP/verify-key.txt")"}
          notes=${notes//@KEYSRC@/"$KEYSRC"}
          notes=${notes//@QT@/"$QT_VERSION"}
          notes=${notes//@SRC@/"$src"}
          printf '%s\n' "$notes" >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # The tag is made after everything else is ready (the packages passed
      # their smoke, the signature checked): a red run leaves no tag. Annotated,
      # on the commit of this run, through the API: the job has no git
      # checkout to push from. A rerun of a failed job finds the tag it made
      # before: on this commit it goes on, on another it fails. The job never
      # moves or deletes a tag.
      - name: Tag the release
        if: needs.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/tag-lookup.err"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"' 2>"$err"); then
            read -r type sha <<<"$existing"
            if [ "$type" = tag ]; then
              read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '"\(.object.type) \(.object.sha)"')
            fi
            [ "$type" = commit ] || { echo "::error::the tag $TAG points to a $type, not a commit"; exit 1; }
            [ "$sha" = "$GITHUB_SHA" ] ||
              { echo "::error::the tag $TAG is on $sha, not on $GITHUB_SHA of this run"; exit 1; }
            echo "the tag $TAG is already on $GITHUB_SHA: going on"
          elif grep -q 'HTTP 404' "$err"; then
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" -f message="roost $TAG" -f object="$GITHUB_SHA" -f type=commit \
              --jq .sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$object" --jq .ref
          else
            cat "$err"
            exit 1
          fi

      # A draft of this tag from an earlier attempt of the run (the job failed
      # after it made the draft, or on the upload) is finished: the assets
      # are uploaded over it (--clobber) and the notes set. A published release
      # of the tag fails the job. The job never deletes and never publishes.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ needs.changes.outputs.last }}
        run: |
          set -euo pipefail
          state=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end")
          # Any published one wins over a draft of the same tag.
          if grep -qx published <<<"$state"; then state=published; fi
          case "$state" in
            published*)
              echo "::error::a published release of $TAG exists: nothing to make"
              exit 1
              ;;
            draft*)
              echo "a draft of $TAG exists from an earlier attempt: uploading the assets over it, setting the notes"
              if [ -n "$LAST" ]; then
                # `gh release edit` has no --generate-notes: the same list from the API.
                gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                  -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$LAST" \
                  --jq .body >>"$RUNNER_TEMP/notes.md"
              fi
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/release/*
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
              ;;
            *)
              args=(--repo "$GITHUB_REPOSITORY" --draft --notes-file "$RUNNER_TEMP/notes.md")
              if [ "$IS_REAL" = true ]; then
                args+=(--verify-tag --title "roost $TAG")
              else
                # A name that is no release, on the commit of the run; the draft
                # makes no git tag.
                args+=(--target "$GITHUB_SHA" --title "dry run $TAG (delete me)")
              fi
              # With a start tag gh appends the generated list of changes to the
              # text of the notes file.
              if [ -n "$LAST" ]; then
                args+=(--generate-notes --notes-start-tag "$LAST")
              fi
              gh release create "$TAG" "${args[@]}" "$RUNNER_TEMP"/release/*
              ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets \
            --jq '"draft=\(.isDraft) tag=\(.tagName) assets: \([.assets[].name] | join(", "))"'
