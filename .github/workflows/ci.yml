name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One version of each tool everywhere. clang-format matches what the pre-commit
# hook runs locally: two versions lay the same code out differently.
env:
  QT_VERSION: 6.12.0
  ZIG_VERSION: 0.17.1
  CLANG_FORMAT_VERSION: 23.1.3
  CLANG_TIDY_VERSION: 20.1.0

# Without an explicit shell, run steps get `bash -e` and no pipefail: a failed
# command on the left of a pipe would go unnoticed.
defaults:
  run:
    shell: bash

jobs:
  # Whether this change needs a build at all (tools/ci_changes.sh): a change
  # to documentation only does not. A job that is not needed skips rather
  # than the workflow filtering by path: the jobs below are required checks,
  # a workflow that never runs leaves them missing and the pull request
  # unmergeable, and a skipped job counts as passed. Pushes to trunk run
  # everything. If this job fails, the answer is unknown and every job runs:
  # the conditions below test for != 'false', and !cancelled() keeps the
  # jobs from skipping on a failed dependency.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes

  # What runs where: dev on macOS, the platform roost ships on; asan-ubsan on
  # Linux arm64; release on Linux arm64 for pull requests and on macOS for
  # trunk pushes. macOS runners are scarce, so a pull request takes one: what
  # only macOS has (native key codes, process groups, libc++) builds and runs
  # in dev, and release on macOS is checked once the change is on trunk.
  # Trunk pushes also run release on Linux arm64 (trunk_only): caches are
  # saved by trunk only, and pull requests read its libghostty-vt build and
  # compiler cache instead of building cold and fetching zig's dependencies.
  # ASan and UBSan check the same code on Linux; ASan on macOS runs nightly
  # (nightly-tsan.yml). Linux builds with clang and the distro's libstdc++,
  # not libc++: a Qt from a binary distribution is built against libstdc++.
  test:
    name: test (${{ matrix.label || matrix.preset }})
    needs: changes
    if: ${{ !cancelled() }}
    # Not skipped at the job level: a skipped matrix job is never expanded,
    # so the required "test (dev)" and the others would wait for ever, and
    # the job-level if cannot see the matrix. The job runs and its steps skip
    # instead, on Linux: macOS runners are the scarce ones. NEEDED below holds
    # the same condition.
    runs-on: ${{ needs.changes.outputs.code != 'false' && !(matrix.trunk_only && github.event_name == 'pull_request') && matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        # TSan runs nightly against a Qt built with it (nightly-tsan.yml).
        include:
          - preset: dev
            runner: macos-15
          - preset: asan-ubsan
            runner: ubuntu-24.04-arm
          - preset: release
            runner: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04-arm' || 'macos-15' }}
          - preset: release
            label: release, linux
            runner: ubuntu-24.04-arm
            trunk_only: true
    env:
      NEEDED: ${{ needs.changes.outputs.code != 'false' && !(matrix.trunk_only && github.event_name == 'pull_request') }}
    steps:
      - uses: actions/checkout@v4
        if: env.NEEDED == 'true'

      - name: Install build tools (macOS)
        if: env.NEEDED == 'true' && runner.os == 'macOS'
        run: brew install ninja ccache

      # clang 20, not the distro's 18: libstdc++ 13 declares std::expected
      # only where the compiler reports __cpp_concepts 202002, which clang 18
      # does not. The presets name the compiler `clang`, hence the links.
      # libclang-rt-20-dev holds the sanitizer runtimes (clang only
      # recommends it). After it come the libraries Qt needs to link (the
      # OpenGL headers) and to run under the offscreen platform, and a
      # monospace font: without one a test that draws the cursor fails.
      - name: Install build tools (Linux)
        if: env.NEEDED == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-20 libclang-rt-20-dev ccache \
            libgl-dev libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0t64 \
            libdbus-1-3 fonts-dejavu-mono
          sudo ln -sf "$(command -v clang-20)" /usr/local/bin/clang
          sudo ln -sf "$(command -v clang++-20)" /usr/local/bin/clang++

      - uses: jurplel/install-qt-action@v4
        if: env.NEEDED == 'true'
        with:
          version: ${{ env.QT_VERSION }}
          # Linux runs arm64 here; macOS takes the defaults.
          host: ${{ runner.os == 'Linux' && 'linux_arm64' || '' }}
          arch: ${{ runner.os == 'Linux' && 'linux_gcc_arm64' || '' }}
          # The libraries are installed above.
          install-deps: false
          cache: true

      - uses: mlugg/setup-zig@v2
        if: env.NEEDED == 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      # setup-zig unpacks zig into a new temporary directory on every run, and
      # the zig build command line holds the path to zig: ninja would see a
      # changed command and rebuild libghostty-vt in spite of the cache. A
      # wrapper at a fixed path, first in PATH, keeps the command the same.
      - name: Zig at a fixed path
        if: env.NEEDED == 'true'
        run: |
          real=$(command -v zig)
          mkdir -p "$HOME/zig-bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$real" > "$HOME/zig-bin/zig"
          chmod +x "$HOME/zig-bin/zig"
          echo "$HOME/zig-bin" >> "$GITHUB_PATH"

      # libghostty-vt takes about two minutes to build. Zig's own cache does
      # not hit on a fresh clone (touching the sources' mtimes alone is
      # enough to miss), so the finished build is cached instead:
      # _deps holds the sources and the library, .ninja_log tells ninja that
      # the zig build command already ran. The key leaves the workflow file
      # out: an edit to it must not throw the entry away.
      - name: Restore libghostty-vt
        if: env.NEEDED == 'true'
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.preset }}/_deps
            build/${{ matrix.preset }}/.ninja_log
            build/${{ matrix.preset }}/.ninja_deps
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ matrix.preset }}-${{ hashFiles('cmake/ghostty.cmake', 'CMakePresets.json') }}

      - name: Restore the compiler cache
        if: env.NEEDED == 'true'
        id: ccache
        uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.preset }}

      - name: Configure
        if: env.NEEDED == 'true'
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        if: env.NEEDED == 'true'
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Compiler cache hits
        if: env.NEEDED == 'true'
        run: ccache --show-stats

      # The frame budget (tests/bench/frame_budget_test.cpp) is a timing on
      # real hardware: a shared runner is about twice as slow and noisy, so
      # here it only prints its numbers.
      - name: Test
        if: env.NEEDED == 'true'
        run: ctest --preset ${{ matrix.preset }}
        env:
          ROOST_FRAME_BUDGET: report

      - name: Qt is linked dynamically
        if: env.NEEDED == 'true'
        run: tools/check_qt_dynamic.sh build/${{ matrix.preset }}

      # The compiler cache is saved by the first trunk push of a day only:
      # the repository's cache is full, and pull requests read what trunk
      # left (.github/actions/ccache).
      - name: Save the compiler cache
        if: ${{ always() && env.NEEDED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' && steps.ccache.outputs.cache-primary-key != '' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  format:
    name: format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: C++
        run: |
          files=$(find src tests plugins -name '*.cpp' -o -name '*.hpp' | sort)
          clang-format --dry-run --Werror $files

      - name: QML
        # qmlformat has no check mode: format to stdout and compare.
        run: |
          failed=0
          dirs=src
          if [ -d plugins ]; then dirs="$dirs plugins"; fi
          for file in $(find $dirs -name '*.qml' | sort); do
            qmlformat "$file" | diff -u "$file" - || failed=1
          done
          exit "$failed"

  # On Linux x64: a macOS runner is the scarce one. The Linux build does not
  # see the Q_OS_MACOS and __APPLE__ branches (src/core/pty.cpp,
  # src/roostd/server.cpp, src/terminal/qt_key_mapping.cpp,
  # tests/qml_api/terminal_item_input_test.cpp,
  # tests/bench/frame_budget_test.cpp), nor tests/bench/terminal_memory.cpp,
  # which is built on macOS only: the pre-commit tidy on the Mac covers them.
  tidy:
    name: tidy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The x64 mirror sometimes serves the packages below (~38 MB) at a few
      # hundred kB/s, minutes in all; their .deb files are cached. A new
      # runner image starts from the last entry and saves its own.
      - name: Runner image
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-tidy-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}
          restore-keys: apt-tidy-${{ runner.os }}-${{ runner.arch }}-

      # clang 20 for the same reason as in the test job; it is also the
      # version of clang-tidy. apt keeps what it downloads in ~/apt-archives,
      # handed back to the runner user so the cache can save it.
      - name: Install build tools
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            ninja-build clang-20 \
            libgl-dev libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0t64 \
            libdbus-1-3
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          sudo ln -sf "$(command -v clang-20)" /usr/local/bin/clang
          sudo ln -sf "$(command -v clang++-20)" /usr/local/bin/clang++

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          # The libraries are installed above.
          install-deps: false
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      # setup-zig unpacks zig into a new temporary directory on every run, and
      # the zig build command line holds the path to zig: ninja would see a
      # changed command and rebuild libghostty-vt in spite of the cache. A
      # wrapper at a fixed path, first in PATH, keeps the command the same.
      - name: Zig at a fixed path
        run: |
          real=$(command -v zig)
          mkdir -p "$HOME/zig-bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$real" > "$HOME/zig-bin/zig"
          chmod +x "$HOME/zig-bin/zig"
          echo "$HOME/zig-bin" >> "$GITHUB_PATH"

      - name: Install clang-tidy
        run: pipx install "clang-tidy==${CLANG_TIDY_VERSION}"

      # ctcache (https://github.com/matus-chochlik/ctcache) remembers the files
      # clang-tidy passed. The key is the file's preprocessed source with
      # its comments (a NOLINT taken out of a header must miss), the
      # clang-tidy arguments and the configuration it dumps for the file, so a
      # change to a header invalidates every file that includes it. Failures
      # are not remembered: a failing file runs again every time. The
      # clang-tidy version is not in that key, so it is in the cache key.
      - name: Install the clang-tidy cache
        run: pipx install "git+https://github.com/matus-chochlik/ctcache@${CTCACHE_COMMIT}"
        env:
          CTCACHE_COMMIT: 2cb1c2bdd86f5e56a9044908f7c36a8a04a30ca2

      # One entry per trunk commit, restored by prefix: GitHub serves the
      # newest entry that matches, so a pull request starts from the latest
      # trunk push and a trunk push from the one before it. A daily key (as
      # the compiler cache has) left most units of a pull request missing,
      # because later commits of the day change their preprocessed source.
      # Entries are a few kilobytes; the oldest are evicted by the cache's
      # own LRU. The save step below is trunk-only.
      - name: Restore the clang-tidy cache
        id: ctcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ctcache
          key: ctcache-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_TIDY_VERSION }}-${{ github.sha }}
          restore-keys: |
            ctcache-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_TIDY_VERSION }}-

      # libghostty-vt takes about two minutes to build. Zig's own cache does
      # not hit on a fresh clone (touching the sources' mtimes alone is
      # enough to miss), so the finished build is cached instead:
      # _deps holds the sources and the library, .ninja_log tells ninja that
      # the zig build command already ran. The key leaves the workflow file
      # out: an edit to it must not throw the entry away.
      - name: Restore libghostty-vt
        uses: actions/cache@v4
        with:
          path: |
            build/dev/_deps
            build/dev/.ninja_log
            build/dev/.ninja_deps
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-dev-${{ hashFiles('cmake/ghostty.cmake', 'CMakePresets.json') }}

      # A build, not just a configure: the libghostty-vt headers come out of
      # zig build and the moc files out of the build as well. No compiler
      # cache: nothing but autogen and zig is compiled.
      - name: Build
        run: |
          cmake --preset dev
          targets=$(ninja -C build/dev -t targets all |
            sed -nE 's/^(zig_build_lib_vt|[A-Za-z0-9_-]+_autogen):.*/\1/p')
          echo "$targets"
          cmake --build --preset dev --target $targets

      # tests/gates/ holds deliberate violations; the gates job owns them.
      # tests/bench/terminal_memory.cpp is built on macOS only (mach), so it
      # is not in the compilation database here.
      - name: Naming and the static analyser
        env:
          CTCACHE_DIR: ${{ runner.temp }}/ctcache
          CTCACHE_KEEP_COMMENTS: "1"
        run: |
          clang-tidy-cache --zero-stats
          find src tests plugins -name '*.cpp' -not -path 'tests/gates/*' \
            -not -path tests/bench/terminal_memory.cpp | sort |
            xargs -P "$(nproc)" -n 1 clang-tidy-cache "$(command -v clang-tidy)" \
              -p build/dev --quiet --warnings-as-errors='*'

      - name: Clang-tidy cache hits
        if: always()
        env:
          CTCACHE_DIR: ${{ runner.temp }}/ctcache
        run: clang-tidy-cache --show-stats | grep '(local)'

      # Also after a failed analyser step: ctcache does not remember failures,
      # so what it saved is only files that passed.
      - name: Save the clang-tidy cache
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' && steps.ctcache.outputs.cache-primary-key != '' && steps.ctcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ctcache
          key: ${{ steps.ctcache.outputs.cache-primary-key }}

  gates:
    name: gates
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: pipx install "clang-tidy==${CLANG_TIDY_VERSION}"

      - name: Naming gate catches a violation in each style
        run: tools/check_naming.sh

      - name: Plugin link gate catches each violation
        run: tools/check_plugin_links.sh

      - name: The CI change filter answers its table
        run: tools/ci_changes_test.sh
