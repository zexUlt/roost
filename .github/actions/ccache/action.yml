name: Compiler cache
description: Restores ccache and points the presets at it. Saving is the job's own step.

# The build directory itself is deliberately not cached: CMake bakes absolute
# paths and timestamps into it, so a restored one is a source of stale-state
# bugs. ccache keys on the preprocessed source instead, which survives a
# different build directory, a different preset and a reordered file list.
#
# Restore only. The repository's Actions cache is full, and new entries push
# out the least recently used ones, among them what is expensive to rebuild
# (the Qt built with TSan, read every night). So the key is the day: the first
# trunk push of a day saves, later runs that day hit it exactly and save
# nothing, and each day adds one entry per preset. Each job that uses this
# action ends with a save step; pull requests read what trunk saved:
#
#   - name: Save the compiler cache
#     if: >-
#       always() && github.event_name != 'pull_request' &&
#       github.ref == 'refs/heads/trunk' &&
#       steps.ccache.outputs.cache-primary-key != '' &&
#       steps.ccache.outputs.cache-hit != 'true'
#     uses: actions/cache/save@v4
#     with:
#       path: ${{ runner.temp }}/ccache
#       key: ${{ steps.ccache.outputs.cache-primary-key }}

inputs:
  key:
    description: Cache key discriminator — normally the preset name
    required: true
  max-size:
    description: Upper bound on the cache
    required: false
    default: "300M"

outputs:
  cache-primary-key:
    description: The key to save the cache under
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: Whether today's entry was restored exactly
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Today
      id: today
      shell: bash
      run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - name: Restore ccache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-${{ steps.today.outputs.date }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-

    - name: Configure ccache
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_MAXSIZE=${{ inputs.max-size }}"
          # Timestamps differ on every checkout; the content does not.
          echo "CCACHE_COMPILERCHECK=content"
          # Lets objects built under different build directories hit.
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          # A debug build puts the working directory into the object, so
          # without this every preset misses everything the others built. The
          # cost is debug paths pointing at whichever build directory came
          # first, which matters to a debugger, not to CI.
          echo "CCACHE_NOHASHDIR=true"
          echo "ROOST_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
        # $GITHUB_ENV reaches the next steps only: name the directory here.
        # The job prints the counters after its build.
        CCACHE_DIR="$RUNNER_TEMP/ccache" ccache --zero-stats >/dev/null
