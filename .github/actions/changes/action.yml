name: Changes
description: Whether this change needs a build and tests, by tools/ci_changes.sh.

# Needs a checkout with history enough to reach the base: fetch-depth 0.
# Anything but a pull request (a push to trunk, a dispatch) needs everything.

outputs:
  code:
    value: ${{ steps.decide.outputs.code }}

runs:
  using: composite
  steps:
    - name: Decide
      id: decide
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "pull_request" ]; then
          changed=$(git diff --name-only "$BASE"...HEAD)
        else
          # Not a pull request: a path that runs everything.
          changed=.github/everything
        fi
        printf '%s\n' "$changed"
        printf '%s\n' "$changed" | tools/ci_changes.sh | tee -a "$GITHUB_OUTPUT"
